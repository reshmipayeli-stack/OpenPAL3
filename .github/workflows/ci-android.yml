name: Android CI Build

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  android-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          which sdkmanager || echo "sdkmanager NOT in PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3" "ndk;25.2.9519653"
          echo "NDK installed at $ANDROID_HOME/ndk/25.2.9519653"
      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm libvulkan-dev wget gnupg ca-certificates
      - name: Set NDK env
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
      - name: Cache ffmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: ${{ runner.os }}-android-vcpkg-${{ hashFiles('vcpkg.json') }}
      - name: Install ffmpeg via vcpkg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          /tmp/vcpkg/bootstrap-vcpkg.sh
          /tmp/vcpkg/vcpkg install --triplet=arm64-android
          cp -r /tmp/vcpkg/vcpkg_installed ./vcpkg_installed
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Build APK
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          export NDK_HOME="$ANDROID_HOME/ndk/25.2.9519653"
          export ANDROID_NDK_HOME="$NDK_HOME"
          cd yaobow/yaobow && cargo apk build --lib
      - name: Collect APK
        run: |
          mkdir -p apk-out
          find "$GITHUB_WORKSPACE" -name "*.apk" -type f 2>/dev/null | tee /tmp/apks.txt
          while read -r f; do [ -n "$f" ] && cp "$f" apk-out/; done < /tmp/apks.txt
          ls -la apk-out/
      - uses: actions/upload-artifact@v4
        with:
          name: openpal3-android-apk
          path: apk-out/*.apk
          if-no-files-found: error
