name: Android CI Build

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  android-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK packages
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -d "$ANDROID_HOME"/cmdline-tools/*/bin 2>/dev/null || true
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found in cmdline-tools; downloading commandline tools"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            cd "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q tools.zip
            mv cmdline-tools latest 2>/dev/null || true
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> $GITHUB_PATH
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-30" "build-tools;30.0.3" "ndk;25.2.9519653"
          echo "--- available NDKs ---"
          ls "$ANDROID_HOME/ndk" || true
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/25.2.9519653 2>/dev/null | head -1)
          if [ -z "$NDK_DIR" ]; then NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | head -1); fi
          echo "Chosen NDK: $NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm libvulkan-dev wget gnupg ca-certificates
          # glslc (Vulkan shader compiler) is required by radiance/build.rs
          sudo apt-get install -y glslang-tools || true
          if ! command -v glslc >/dev/null 2>&1; then
            echo "glslc missing; installing LunarG Vulkan SDK"
            wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
            sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
            sudo apt-get update
            sudo apt-get install -y vulkan-sdk || true
          fi
          if ! command -v glslc >/dev/null 2>&1; then
            echo "::error::glslc still unavailable"
            exit 1
          fi
          glslc --version
          # libclang is required by bindgen (ffmpeg-sys)
          sudo apt-get install -y libclang-dev llvm-dev
          echo "--- locate libclang ---"
          find /usr/lib -name "libclang*.so*" 2>/dev/null | head -10
      - name: Verify NDK env
        run: |
          echo "NDK_HOME=$NDK_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          test -d "$ANDROID_NDK_HOME" && echo "NDK dir OK"
      - name: Cache ffmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: ${{ runner.os }}-android-vcpkg-${{ hashFiles('vcpkg.json') }}
      - name: Install ffmpeg via vcpkg
        run: |
          set -euo pipefail
          if [ ! -x /tmp/vcpkg/vcpkg ]; then
            git clone https://github.com/microsoft/vcpkg.git /tmp/vcpkg
            /tmp/vcpkg/bootstrap-vcpkg.sh
          fi
          /tmp/vcpkg/vcpkg install --triplet=arm64-android
          echo "--- where did vcpkg put things? ---"
          ls -d vcpkg_installed 2>/dev/null || true
          ls -d /tmp/vcpkg/vcpkg_installed 2>/dev/null || true
          if [ -d /tmp/vcpkg/vcpkg_installed ] && [ ! -d vcpkg_installed ]; then
            cp -r /tmp/vcpkg/vcpkg_installed ./vcpkg_installed
          fi
          test -d vcpkg_installed
          find vcpkg_installed -name "*.a" | head -20
      - name: Drop stale lock entries for patched crates
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("Cargo.lock")
          s = p.read_text()
          # Remove the [[package]] block for imgui-winit-support so the
          # [patch.crates-io] path override is actually selected.
          pattern = re.compile(
              r"\[\[package\]\]\nname = \"(?:imgui-winit-support|native-dialog)\"\n(?:[^\[]|\[(?!\[package))*(?=\[\[package\]\]|\Z)",
              re.S,
          )
          new, n = pattern.subn("", s)
          p.write_text(new)
          print("removed blocks:", n)
          PY
          grep -c 'imgui-winit-support' Cargo.lock || echo "entry gone"
          echo "--- vendored crate present? ---"
          ls vendor/imgui-winit-support/src/lib.rs

      - name: Compile cdylib for arm64
        run: |
          set -o pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target list --installed | grep aarch64 || rustup target add aarch64-linux-android
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          echo "toolchain: $TOOLCHAIN"
          echo "sysroot:   $SYSROOT"
          ls "$TOOLCHAIN"/aarch64-linux-android*-clang | head -5
          echo "--- sysroot include ---"
          ls "$SYSROOT/usr/include" | head -5
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          export CFLAGS_aarch64_linux_android="--target=aarch64-linux-android24 --sysroot=$SYSROOT"
          export CXXFLAGS_aarch64_linux_android="--target=aarch64-linux-android24 --sysroot=$SYSROOT"
          # bindgen (ffmpeg-sys) must use the Android sysroot, not host /usr/include
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--sysroot=$SYSROOT --target=aarch64-linux-android24 -I$SYSROOT/usr/include -I$SYSROOT/usr/include/aarch64-linux-android"
          export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$SYSROOT --target=aarch64-linux-android24 -I$SYSROOT/usr/include -I$SYSROOT/usr/include/aarch64-linux-android"
          # Prefer a real host libclang for bindgen (the NDK ships clang libs
          # but not a libclang.so that bindgen's loader recognises).
          LIBCLANG_FILE=$(find /usr/lib /usr/local/lib -name 'libclang-*.so*' -o -name 'libclang.so*' 2>/dev/null | head -1)
          echo "LIBCLANG_FILE=$LIBCLANG_FILE"
          if [ -n "$LIBCLANG_FILE" ]; then
            export LIBCLANG_PATH="$(dirname "$LIBCLANG_FILE")"
          else
            export LIBCLANG_PATH="/usr/lib/llvm-14/lib"
          fi
          echo "LIBCLANG_PATH=$LIBCLANG_PATH"
          ls "$LIBCLANG_PATH"/libclang* 2>/dev/null | head -3 || echo "no libclang in LIBCLANG_PATH"
          echo "BINDGEN_EXTRA_CLANG_ARGS=$BINDGEN_EXTRA_CLANG_ARGS"
          cargo build --release --target aarch64-linux-android -p yaobow --lib 2>&1 | tail -80
          echo "=== produced .so ==="
          ls -lh target/aarch64-linux-android/release/libyaobow_lib.so

      - name: Package APK (aapt + zipalign + apksigner)
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/30.0.3"
          PLAT="$ANDROID_HOME/platforms/android-30/android.jar"
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SYSLIB="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android"
          SO=target/aarch64-linux-android/release/libyaobow_lib.so

          rm -rf apkbuild apk-out && mkdir -p apkbuild/lib/arm64-v8a apk-out
          cp "$SO" apkbuild/lib/arm64-v8a/
          "$TOOLCHAIN/llvm-strip" --strip-unneeded apkbuild/lib/arm64-v8a/libyaobow_lib.so
          ls -lh apkbuild/lib/arm64-v8a/

          echo "=== NEEDED shared libraries ==="
          NEEDED=$("$TOOLCHAIN/llvm-readelf" -d "$SO" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p')
          echo "$NEEDED"
          SYSTEM_LIBS="libc.so libm.so libdl.so liblog.so libandroid.so libvulkan.so libEGL.so libGLESv1_CM.so libGLESv2.so libGLESv3.so libOpenSLES.so libaaudio.so libmediandk.so libz.so libjnigraphics.so libnativewindow.so"
          MISSING=""
          for lib in $NEEDED; do
            case " $SYSTEM_LIBS " in *" $lib "*) continue;; esac
            if [ -f "$SYSLIB/$lib" ]; then
              echo "bundling $lib from NDK"
              cp "$SYSLIB/$lib" apkbuild/lib/arm64-v8a/
            else
              MISSING="$MISSING $lib"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Non-system shared libraries not found to bundle:$MISSING"
            exit 1
          fi

          cat > AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="io.github.openpal3.yaobow"
              android:versionCode="1"
              android:versionName="0.4-touch">
              <uses-sdk android:minSdkVersion="26" android:targetSdkVersion="29" />
              <uses-feature android:name="android.hardware.vulkan.level" android:required="false" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <application
                  android:label="OpenPAL3"
                  android:hasCode="false"
                  android:extractNativeLibs="true"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name="android.app.NativeActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|keyboard|navigation">
                      <meta-data android:name="android.app.lib_name" android:value="yaobow_lib" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          "$BT/aapt" package -f -M AndroidManifest.xml -I "$PLAT" -F unsigned.apk
          # Native .so files MUST be stored uncompressed and page-aligned,
          # otherwise Android cannot mmap them from the APK and NativeActivity
          # exits immediately without any crash log.
          (cd apkbuild && zip -0 -r -q ../unsigned.apk lib)
          "$BT/zipalign" -f -p 4 unsigned.apk aligned.apk
          # Fixed debug key (android/debug.p12) so updates install over the
          # previous build instead of failing on a signature mismatch.
          "$BT/apksigner" sign --ks android/debug.p12 --ks-type PKCS12 \
            --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey \
            --out apk-out/OpenPAL3.apk aligned.apk
          "$BT/apksigner" verify --verbose apk-out/OpenPAL3.apk | head -5

          echo "=== APK contents ==="
          unzip -l apk-out/OpenPAL3.apk
          unzip -l apk-out/OpenPAL3.apk | grep -q 'lib/arm64-v8a/libyaobow_lib.so' \
            || { echo "::error::APK is missing libyaobow_lib.so"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: openpal3-android-apk
          path: apk-out/*.apk
          if-no-files-found: error
