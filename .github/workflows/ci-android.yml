name: Android CI Build

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  android-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK packages
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -d "$ANDROID_HOME"/cmdline-tools/*/bin 2>/dev/null || true
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found in cmdline-tools; downloading commandline tools"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            cd "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q tools.zip
            mv cmdline-tools latest 2>/dev/null || true
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> $GITHUB_PATH
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-30" "build-tools;30.0.3" "ndk;25.2.9519653"
          echo "--- available NDKs ---"
          ls "$ANDROID_HOME/ndk" || true
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/25.2.9519653 2>/dev/null | head -1)
          if [ -z "$NDK_DIR" ]; then NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | head -1); fi
          echo "Chosen NDK: $NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm libvulkan-dev wget gnupg ca-certificates
          # glslc (Vulkan shader compiler) is required by radiance/build.rs
          sudo apt-get install -y glslang-tools || true
          if ! command -v glslc >/dev/null 2>&1; then
            echo "glslc missing; installing LunarG Vulkan SDK"
            wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
            sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
            sudo apt-get update
            sudo apt-get install -y vulkan-sdk || true
          fi
          if ! command -v glslc >/dev/null 2>&1; then
            echo "::error::glslc still unavailable"
            exit 1
          fi
          glslc --version
          # libclang is required by bindgen (ffmpeg-sys)
          sudo apt-get install -y libclang-dev llvm-dev
          echo "--- locate libclang ---"
          find /usr/lib -name "libclang*.so*" 2>/dev/null | head -10
      - name: Verify NDK env
        run: |
          echo "NDK_HOME=$NDK_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          test -d "$ANDROID_NDK_HOME" && echo "NDK dir OK"
      - name: Cache ffmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: ${{ runner.os }}-android-vcpkg-${{ hashFiles('vcpkg.json') }}
      - name: Install ffmpeg via vcpkg
        run: |
          set -euo pipefail
          if [ ! -x /tmp/vcpkg/vcpkg ]; then
            git clone https://github.com/microsoft/vcpkg.git /tmp/vcpkg
            /tmp/vcpkg/bootstrap-vcpkg.sh
          fi
          /tmp/vcpkg/vcpkg install --triplet=arm64-android
          echo "--- where did vcpkg put things? ---"
          ls -d vcpkg_installed 2>/dev/null || true
          ls -d /tmp/vcpkg/vcpkg_installed 2>/dev/null || true
          if [ -d /tmp/vcpkg/vcpkg_installed ] && [ ! -d vcpkg_installed ]; then
            cp -r /tmp/vcpkg/vcpkg_installed ./vcpkg_installed
          fi
          test -d vcpkg_installed
          find vcpkg_installed -name "*.a" | head -20
      - name: Install cargo-apk
        run: |
          cargo install cargo-apk --version 0.8.2 --locked --force
          ls -la "$HOME/.cargo/bin/cargo-apk"
      - name: Compile cdylib for arm64
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target list --installed | grep aarch64 || rustup target add aarch64-linux-android
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          echo "toolchain: $TOOLCHAIN"
          echo "sysroot:   $SYSROOT"
          ls "$TOOLCHAIN"/aarch64-linux-android*-clang | head -5
          echo "--- sysroot include ---"
          ls "$SYSROOT/usr/include" | head -5
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          export CFLAGS_aarch64_linux_android="--target=aarch64-linux-android24 --sysroot=$SYSROOT"
          export CXXFLAGS_aarch64_linux_android="--target=aarch64-linux-android24 --sysroot=$SYSROOT"
          # bindgen (ffmpeg-sys) must use the Android sysroot, not host /usr/include
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--sysroot=$SYSROOT --target=aarch64-linux-android24 -I$SYSROOT/usr/include -I$SYSROOT/usr/include/aarch64-linux-android"
          export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$SYSROOT --target=aarch64-linux-android24 -I$SYSROOT/usr/include -I$SYSROOT/usr/include/aarch64-linux-android"
          # Prefer a real host libclang for bindgen (the NDK ships clang libs
          # but not a libclang.so that bindgen's loader recognises).
          LIBCLANG_FILE=$(find /usr/lib /usr/local/lib -name 'libclang-*.so*' -o -name 'libclang.so*' 2>/dev/null | head -1)
          echo "LIBCLANG_FILE=$LIBCLANG_FILE"
          if [ -n "$LIBCLANG_FILE" ]; then
            export LIBCLANG_PATH="$(dirname "$LIBCLANG_FILE")"
          else
            export LIBCLANG_PATH="/usr/lib/llvm-14/lib"
          fi
          echo "LIBCLANG_PATH=$LIBCLANG_PATH"
          ls "$LIBCLANG_PATH"/libclang* 2>/dev/null | head -3 || echo "no libclang in LIBCLANG_PATH"
          echo "BINDGEN_EXTRA_CLANG_ARGS=$BINDGEN_EXTRA_CLANG_ARGS"
          cargo build --release --target aarch64-linux-android -p yaobow --lib 2>&1 | tail -60
          echo "=== produced .so ==="
          find target/aarch64-linux-android -name "*.so" -exec ls -lh {} \; || echo "none"

      - name: Package APK
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd yaobow/yaobow
          cargo apk build --lib 2>&1 | tail -30 || echo "cargo-apk packaging step reported failure"
          echo "=== apk artifacts ==="
          find . -name "*.apk" -exec ls -lh {} \;
      - name: Collect APK
        run: |
          mkdir -p apk-out
          find "$GITHUB_WORKSPACE" -name "*.apk" -type f 2>/dev/null | tee /tmp/apks.txt
          while read -r f; do [ -n "$f" ] && cp "$f" apk-out/; done < /tmp/apks.txt
          ls -la apk-out/
          echo "=== verify each apk contains native libs ==="
          for a in apk-out/*.apk; do
            [ -e "$a" ] || continue
            echo "--- $a ($(stat -c%s "$a") bytes) ---"
            unzip -l "$a" | grep -E '\.so|lib/' || echo "NO NATIVE LIBS IN $a"
          done
          # fail loudly if every apk is a stub (manifest only)
          GOOD=0
          for a in apk-out/*.apk; do
            [ -e "$a" ] || continue
            if unzip -l "$a" | grep -q '\.so'; then GOOD=1; fi
          done
          if [ "$GOOD" = "0" ]; then
            echo "::error::No APK contains native .so libraries - the build produced a stub package"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: openpal3-android-apk
          path: apk-out/*.apk
          if-no-files-found: error
